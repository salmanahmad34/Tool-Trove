<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ToolTrove — Smart Online Tools</title>
  <script type="text/javascript">
    // Single Page Apps for GitHub Pages
    // https://github.com/rafgraph/spa-github-pages
    // Copyright (c) 2016 Rafael Pedicini, licensed under the MIT License
    // ----------------------------------------------------------------------
    // This script takes the current url and converts the path and query string
    // into just a query string, then redirects the browser to the new url with
    // only a query string and hash fragment.
    // If the site is a project page (e.g. salmanahmad34.github.io/Tool-Trove/),
    // pathSegmentsToKeep is 1. If it's a custom domain or user page, it's 0.
    var pathSegmentsToKeep = 1;

    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
  <!-- 
    IE requires the 404 page to be at least 512 bytes to display it.
    This comment serves to ensure the file size is well over that threshold:
    Lorem ipsum dolor sit amet, consectetur adipiscing elit. Aliquam nec feugiat
    tellus. Fusce laoreet hendrerit neque, eu interdum nulla lacinia vel.
    Pellentesque habitant morbi tristique senectus et netus et malesuada fames
    ac turpis egestas. Vestibulum tristique sapien vitae neque interdum tincidunt.
    Quisque a purus non nulla condimentum rhoncus.
  -->
</body>
</html>
