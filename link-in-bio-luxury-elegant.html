<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luxury & Elegant | Link in Bio</title>
  
  <!-- Fonts: Cormorant Garamond (Serif) & Montserrat (Sans Serif) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
  
  <style>
    /* CSS Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Core Variables */
    :root {
      --bg-dark: #0d0d0d;
      --card-bg: #1f1f1f;
      --accent-gold: #d4af37;
      --accent-burgundy: #6b1f47;
      --text-main: #f5f5f5;
      --text-muted: #aaaaaa;
      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-sans: 'Montserrat', -apple-system, sans-serif;
      --transition-slow: all 400ms cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    /* Base Styling */
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 5rem 1rem;
      line-height: 1.6;
      /* Subtle noise texture for premium feel */
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
    }

    /* Animation Keyframes */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .animate-fade-up {
      animation: fadeUp 1s ease-out forwards;
      opacity: 0;
    }
    
    .delay-1 { animation-delay: 200ms; }
    .delay-2 { animation-delay: 400ms; }
    .delay-3 { animation-delay: 600ms; }

    /* Typography Hierarchy */
    h1, h2, h3 {
      font-family: var(--font-serif);
      font-weight: 600;
    }

    h1 {
      font-size: 38px;
      color: var(--accent-gold);
      letter-spacing: 2px;
      text-transform: uppercase;
      line-height: 1.2;
    }

    p {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 300;
      letter-spacing: 0.5px;
    }

    /* Container */
    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 3.5rem;
    }

    /* Profile Section */
    .profile {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .avatar-wrapper {
      position: relative;
      margin-bottom: 2.5rem;
    }

    .avatar-wrapper::after {
      content: '';
      position: absolute;
      top: -8px; left: -8px; right: -8px; bottom: -8px;
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 50%;
      pointer-events: none;
    }

    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent-gold);
      padding: 3px;
      background-color: var(--bg-dark);
    }

    .name-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    /* Decorative gold lines */
    .decorative-line {
      width: 40px;
      height: 1px;
      background-color: var(--accent-gold);
      opacity: 0.6;
    }

    .bio {
      max-width: 90%;
      margin: 0 auto;
      font-style: italic;
      font-family: var(--font-serif);
      font-size: 18px;
      color: var(--text-main);
    }

    /* Social Icons Section */
    .social-strip {
      display: flex;
      justify-content: center;
      gap: 1.25rem;
    }

    .social-icon {
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-gold);
      text-decoration: none;
      border: 1px solid rgba(212, 175, 55, 0.4);
      border-radius: 50%;
      transition: var(--transition-slow);
      position: relative;
      overflow: hidden;
    }

    .social-icon svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
      z-index: 2;
      transition: var(--transition-slow);
    }

    .social-icon::before {
      content: '';
      position: absolute;
      inset: 0;
      background-color: var(--accent-gold);
      opacity: 0;
      transition: var(--transition-slow);
      z-index: 1;
    }

    .social-icon:hover {
      border-color: var(--accent-gold);
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
    }

    .social-icon:hover::before {
      opacity: 1;
    }

    .social-icon:hover svg {
      color: var(--bg-dark);
    }

    /* Link Cards List */
    .links-wrapper {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .link-card {
      display: flex;
      align-items: center;
      background-color: var(--card-bg);
      border: 1.5px solid rgba(212, 175, 55, 0.2);
      padding: 1.25rem 1.75rem;
      text-decoration: none;
      color: var(--text-main);
      transition: var(--transition-slow);
      position: relative;
    }

    /* Subtle subtle burgundy hover overlay */
    .link-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(107, 31, 71, 0.05), transparent);
      opacity: 0;
      transition: var(--transition-slow);
      pointer-events: none;
    }

    .link-card:hover {
      border-color: rgba(212, 175, 55, 0.6);
      box-shadow: 0 4px 20px rgba(212, 175, 55, 0.1);
      background-color: #242424;
      transform: translateY(-2px);
    }

    .link-card:hover::before {
      opacity: 1;
    }

    .card-icon {
      width: 20px;
      height: 20px;
      margin-right: 1.25rem;
      color: var(--accent-gold);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition-slow);
    }

    .card-icon svg {
      width: 100%;
      height: 100%;
      stroke: currentColor;
      stroke-width: 1.5;
      fill: none;
    }

    .card-content {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .card-title {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-main);
      transition: var(--transition-slow);
    }

    .link-card:hover .card-title {
      color: var(--accent-gold);
    }

    .card-desc {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 300;
    }

    /* Call-To-Action Button */
    .cta-container {
      margin-top: 1rem;
    }

    .cta-button {
      display: block;
      width: 100%;
      text-align: center;
      padding: 1.25rem;
      background-color: transparent;
      border: 1.5px solid var(--accent-gold);
      color: var(--accent-gold);
      text-decoration: none;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 3px;
      text-transform: uppercase;
      transition: var(--transition-slow);
    }

    .cta-button:hover {
      background-color: var(--accent-gold);
      color: var(--bg-dark);
      box-shadow: 0 0 25px rgba(212, 175, 55, 0.2);
    }

    /* Minimal Footer */
    .footer {
      text-align: center;
      margin-top: 1rem;
      font-size: 10px;
      color: rgba(255, 255, 255, 0.2);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* Mobile Responsive */
    @media (max-width: 480px) {
      body { padding: 3rem 1.25rem; }
      h1 { font-size: 28px; }
      .avatar { width: 90px; height: 90px; }
      .link-card { padding: 1rem 1.25rem; }
      .card-icon { margin-right: 1rem; }
    }
  </style>
</head>
<body>
