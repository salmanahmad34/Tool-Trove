<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>ToolTrove — Redirecting...</title>
    <script type="text/javascript">
      // GitHub Pages Single Page Application (SPA) Router Redirect for HashRouter
      // Redirects direct URLs like /Tool-Trove/tools/developer directly to /Tool-Trove/#/tools/developer
      var l = window.location;
      var basePath = '/Tool-Trove';
      var path = l.pathname;

      if (path.indexOf(basePath) === 0) {
        var subPath = path.substring(basePath.length);
        // Ensure no double slashes when creating hash path
        if (subPath.indexOf('/') === 0) {
          subPath = subPath.substring(1);
        }
        var newUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + basePath + '/#/' + subPath + l.search + l.hash;
        l.replace(newUrl);
      } else {
        l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + basePath + '/');
      }
    </script>
  </head>
  <body>
    <div style="font-family: 'Plus Jakarta Sans', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #FDFBF7; color: #1e293b;">
      <h2 style="color: #ff5c1a;">Redirecting to habitat...</h2>
      <p style="font-size: 14px; color: #64748b;">Please wait while the wise owl guides you home.</p>
    </div>
  </body>
</html>
