<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .brand-primary {
      fill: #0F172A;
    }
    @media (prefers-color-scheme: dark) {
      .brand-primary {
        fill: #F8FAFC;
      }
    }
  </style>
  <!-- Clean top bar -->
  <rect x="20" y="20" width="60" height="12" rx="2.5" class="brand-primary" />
  <!-- Left stem (primary T) -->
  <rect x="36" y="38" width="12" height="42" rx="2.5" class="brand-primary" />
  <!-- Right stem (secondary T) -->
  <rect x="52" y="38" width="12" height="26" rx="2.5" class="brand-primary" />
  <!-- Precision soft orange/red accent block -->
  <rect x="52" y="68" width="12" height="12" rx="2.5" fill="#EA580C" />
</svg>